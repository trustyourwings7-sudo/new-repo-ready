name: PIES research run
# The PIES app finds the run it started by this title.
run-name: ${{ github.event.inputs.request_id && format('PIES research app-{0}', github.event.inputs.request_id) || 'PIES research run' }}
# The n8n replacement. Runs pies/scripts/run-pipeline.ts on a GitHub-hosted runner.
#
# ACTIVATION REQUIRES THE OWNER. Today this only runs when started by hand, and even then
# the runner refuses to call any provider unless ALL of these hold:
#   - the "live" choice below is set to "yes" when the run is started (default "no")
#   - the config secret carries pricesConfirmedOn within the last 31 days
#   - EXA_API_KEY and FIRECRAWL_API_KEY secrets exist
#   - in the database: user_preferences.paid_operations_enabled (the real lock), and each
#     provider row in provider_configs is enabled AND pricing_verified, with monthly caps
# Secrets (4): PIES_PIPELINE_CONFIG_JSON (profile, queries, ownerUserId, integrationId,
#   pricesConfirmedOn), PIES_AUTOMATION_DATABASE_URL, EXA_API_KEY, FIRECRAWL_API_KEY.
# To schedule it, uncomment `schedule` below (owner decision; see pies/docs/RUNNER.md).
#
# PUBLIC REPOSITORY: run logs are public. The runner prints aggregate metrics only;
# never add steps that print the report, upload it as an artifact, or echo secrets.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "no = connection check only (no providers, nothing written). yes = real research (database switch must also be on)"
        type: choice
        options: ["no", "yes"]
        default: "no"
      # Set by the PIES app's "Research Now" (owner-only). Empty = the configured daily queries.
      query:
        description: "Optional one-off search (3-120 letters/digits/basic punctuation)"
        type: string
        default: ""
      category:
        description: "Category for the one-off search"
        type: choice
        options: ["scholarship", "grant", "funding", "education", "employment", "accelerator", "partnership", "consulting", "commercial", "other"]
        default: "scholarship"
      request_id:
        description: "PIES app request id (budget idempotency key)"
        type: string
        default: ""
  # Daily research, first attempt 05:17 UTC = 07:17 Kigali (owner-approved 2026-11-07).
  # GitHub skips scheduled slots under load (observed 2026-11-07: 2 of ~13 hourly slots fired), so
  # there are three attempts; the first that runs does the research, later ones report
  # "already_done" (budget keys are per day, nothing is spent twice).
  # Pause at any time: set user_preferences.paid_operations_enabled = false (runs report "paused").
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: pies-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pies-production
    defaults:
      run:
        working-directory: pies
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.x"
      - run: corepack enable && pnpm install --frozen-lockfile --prod=false
      - name: Research run (metrics only)
        run: node --no-warnings scripts/run-pipeline.ts && echo "(metrics above; details are in PIES, never in this public log)"
        env:
          PIES_PIPELINE_CONFIG_JSON: ${{ secrets.PIES_PIPELINE_CONFIG_JSON }}
          PIES_AUTOMATION_DATABASE_URL: ${{ secrets.PIES_AUTOMATION_DATABASE_URL }}
          # Scheduled runs are live (the database switch is the pause); manual runs follow the choice.
          PIES_LIVE_RESEARCH: ${{ (github.event_name == 'schedule' || github.event.inputs.live == 'yes') && '1' || '' }}
          # Manual "live = no" runs a read-only connection check.
          PIES_CONNECTION_CHECK: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.live != 'yes') && '1' || '' }}
          # Owner limits: at most 3 searches and 4 official-page extractions per run (lower of these and the secret).
          PIES_MAX_SEARCHES: "3"
          PIES_MAX_EXTRACTIONS: "4"
          # Inputs go through env (never interpolated into the shell); the runner validates them.
          PIES_ADHOC_QUERY: ${{ github.event.inputs.query }}
          PIES_ADHOC_CATEGORY: ${{ github.event.inputs.category }}
          PIES_REQUEST_ID: ${{ github.event.inputs.request_id }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
